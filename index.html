<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="AXXAM ERP — gestion intégrée SARL DPR AXXAM (chargement, production, stocks, finances)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>AXXAM ERP — SARL DPR AXXAM</title>
    <script>
      // Applique le thème enregistré avant tout rendu (React, CSS) pour éviter
      // un flash du mauvais thème. Garder la clé synchronisée avec
      // STORAGE_KEY dans src/lib/theme.js.
      (function () {
        try {
          var stored = localStorage.getItem('axxam-theme')
          document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
